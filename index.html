<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Grand Fable GP</title>
<meta name="description" content="Grand Fable GP - a 3D racing game: 18 real 3D cars, trucks and exotics, 7 tracks, boost, jumps and drifts.">
<meta name="theme-color" content="#0b1230">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fable GP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* standalone shell: only what the game screens need from a host page (race3d.js injects its own game CSS) */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0%,#1d2b6b,#0b1230 60%,#060a1c);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:1600px;margin:0 auto;padding:10px 8px 24px}
.center{text-align:center}.spacer{height:24px}.muted{color:#b8c2dc}
.fadein{animation:gfIn .35s ease}@keyframes gfIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,#ffe066,#FFD700);color:#1d2a2a;font-weight:900;font-size:20px;border:4px solid #2F4F4F;border-radius:18px;padding:14px 24px;cursor:pointer;box-shadow:0 6px 0 #2F4F4F;font-family:inherit;min-height:60px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #2F4F4F}
.btn.big{font-size:24px;padding:16px 30px}
.btn.secondary{background:#1E90FF;color:#fff}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.readbtn{background:#1E90FF;border:3px solid #2F4F4F;color:#fff;border-radius:14px;font-size:16px;font-weight:800;padding:10px 18px;cursor:pointer;font-family:inherit;min-height:48px}
.btn[onclick="renderRace2D()"]{display:none}   /* the classic 2D racer lives only in the Learning Zone */
.ananse-wrap{display:flex;justify-content:center}
#gfToast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);background:#1a1f38;border:3px solid #FFD700;color:#fff;font-weight:800;padding:10px 18px;border-radius:14px;opacity:0;transition:.25s;z-index:9999;pointer-events:none;max-width:90vw;text-align:center}
#gfToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* title */
.gf-title{position:relative;min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center;border-radius:24px;overflow:hidden}
@supports (height:100dvh){.gf-title{min-height:calc(100dvh - 40px)}}
.gf-hero{position:absolute;inset:0}.gf-hero img{width:100%;height:100%;object-fit:cover;filter:saturate(1.1)}
.gf-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,28,.15),rgba(6,10,28,.75))}
.gf-panel{position:relative;text-align:center;padding:24px 20px;max-width:640px}
.gf-panel h1{margin:0;font-size:clamp(40px,8vw,84px);font-weight:900;font-style:italic;letter-spacing:-.01em;line-height:.95;text-shadow:0 5px 0 #2F4F4F,0 10px 30px rgba(0,0,0,.6)}
.gf-panel h1 em{color:#FFD700}
.gf-panel p{font-weight:800;color:#e9ecf7;text-shadow:0 2px 6px #000;margin:12px 0 18px}
.gf-play{font-family:inherit;font-size:clamp(28px,4vw,38px);font-weight:900;font-style:italic;color:#1d2a2a;background:#FFD700;border:5px solid #2F4F4F;border-radius:24px;padding:16px 56px;min-height:84px;box-shadow:0 8px 0 #2F4F4F,0 0 40px rgba(255,215,0,.45);cursor:pointer;animation:gfPulse 1.4s ease-in-out infinite alternate}
.gf-play:active{transform:translateY(6px);box-shadow:0 2px 0 #2F4F4F}
@keyframes gfPulse{to{box-shadow:0 8px 0 #2F4F4F,0 0 70px rgba(255,215,0,.75)}}
.gf-row{display:flex;gap:12px;justify-content:center;margin-top:18px}
.gf-sm{font-family:inherit;font-size:18px;font-weight:900;color:#fff;background:#1E90FF;border:4px solid #2F4F4F;border-radius:18px;padding:10px 20px;min-height:64px;box-shadow:0 6px 0 #2F4F4F;cursor:pointer}
.gf-sm:active{transform:translateY(4px);box-shadow:0 2px 0 #2F4F4F}
.gf-note{font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script src="app-shim.js"></script>
<script src="race3d.js"></script>
<script>
/* boot: title screen; offline cache via this app's own service worker (scope ./, caches named gfgp-*) */
renderHome();
if("serviceWorker" in navigator&&location.protocol!=="file:"){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(()=>{});});}
</script>
</body>
</html>
